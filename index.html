<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ai TRADING｜案件投稿</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c10;--surface:#13161e;--surface2:#1b1f2a;
  --border:#252a38;--accent:#e8341c;--accent2:#ff6b4a;
  --text:#e8eaf0;--muted:#5a6070;--gold:#f5a623;--green:#34d399;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;padding:24px 20px 48px;max-width:640px;margin:0 auto}
.header{display:flex;align-items:center;gap:14px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.logo{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:3px;background:rgba(232,52,28,0.1);border:1px solid rgba(232,52,28,0.25);padding:5px 12px;border-radius:3px}
.header-title{font-size:16px;font-weight:500}
.header-sub{font-size:11px;color:var(--muted);margin-left:auto;font-family:'Space Mono',monospace}

.drop-zone{border:2px dashed var(--border);border-radius:10px;padding:28px 20px;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:16px;position:relative;background:var(--surface)}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:rgba(232,52,28,0.04)}
.drop-zone.has-file{border-color:var(--green);border-style:solid;background:rgba(52,211,153,0.04)}
.drop-icon{font-size:28px;margin-bottom:8px;opacity:0.5}
.drop-title{font-size:13px;font-weight:500;margin-bottom:3px}
.drop-sub{font-size:12px;color:var(--muted)}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}

.btn-analyze{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),#c42a14);border:none;border-radius:8px;color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px}
.btn-analyze:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 20px rgba(232,52,28,0.3)}
.btn-analyze:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none}

.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:10px;letter-spacing:2px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

.section-label{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.form-section{margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:13px;padding:10px 12px;outline:none;transition:border-color 0.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted)}
.field select option{background:var(--surface2)}
.field textarea{resize:vertical;min-height:64px}
.field input.ai-filled,.field select.ai-filled,.field textarea.ai-filled{border-color:rgba(245,166,35,0.5);background:rgba(245,166,35,0.04)}

.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.type-btn{padding:8px 6px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);font-family:'Noto Sans JP',sans-serif;font-size:11px;cursor:pointer;transition:all 0.15s;text-align:center}
.type-btn:hover{border-color:var(--text);color:var(--text)}
.type-btn.active{border-color:var(--accent);background:rgba(232,52,28,0.1);color:var(--accent)}

.config-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:16px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.config-toggle-label{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
.config-toggle-status{font-size:11px;color:var(--muted);margin-left:auto}
.config-toggle-status.ok{color:var(--green)}
.config-toggle-arrow{font-size:10px;color:var(--muted);margin-left:4px}
.config-body{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;padding:14px;margin-top:-16px;margin-bottom:16px;display:none}
.config-body.open{display:block}
.config-row{display:flex;gap:8px}
.config-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Space Mono',monospace;font-size:11px;padding:8px 10px;outline:none}
.config-row input:focus{border-color:var(--gold)}
.btn-save-url{padding:8px 14px;background:transparent;border:1px solid var(--gold);border-radius:6px;color:var(--gold);font-size:11px;cursor:pointer;white-space:nowrap;font-family:'Noto Sans JP',sans-serif}
.btn-save-url:hover{background:rgba(245,166,35,0.1)}
.config-hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6}

.btn-submit{width:100%;padding:15px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-submit:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.btn-submit:disabled{opacity:0.4;cursor:not-allowed}

.status-bar{margin-top:12px;padding:12px 16px;border-radius:8px;font-size:13px;display:none;line-height:1.6}
.status-bar.visible{display:block}
.status-bar.loading{background:rgba(232,52,28,0.08);border:1px solid rgba(232,52,28,0.2);color:var(--accent2)}
.status-bar.success{background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2);color:var(--green)}
.status-bar.error{background:rgba(232,52,28,0.08);border:1px solid rgba(232,52,28,0.2);color:var(--accent2)}

.spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.ai-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(245,166,35,0.1);border:1px solid rgba(245,166,35,0.3);color:var(--gold);margin-bottom:12px}

.history{margin-top:28px}
.history-label{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.history-item{background:var(--surface);border:1px solid var(--border);border-left:2px solid var(--green);border-radius:6px;padding:10px 14px;margin-bottom:8px;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.history-name{font-size:13px;font-weight:500}
.history-meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.badge-ok{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);color:var(--green)}
</style>
</head>
<body>

<div class="header">
  <div class="logo">ai TRADING</div>
  <div class="header-title">案件投稿</div>
  <div class="header-sub">PROPERTY SUBMISSION</div>
</div>

<!-- 接続設定 -->
<div class="config-toggle" onclick="toggleConfig()">
  <span style="font-size:14px">⚙</span>
  <span class="config-toggle-label">接続設定</span>
  <span class="config-toggle-status" id="configStatus">未設定</span>
  <span class="config-toggle-arrow" id="configArrow">▼</span>
</div>
<div class="config-body" id="configBody">
  <div class="config-hint" style="margin-bottom:10px">
    Apps Script URLを設定するとスプレッドシートに直接投稿できます。<br>
    <code style="background:var(--surface2);padding:1px 5px;border-radius:3px;font-size:10px">https://script.google.com/macros/s/.../exec</code> の形式のURLを貼ってください。
  </div>
  <div class="config-row">
    <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <button class="btn-save-url" onclick="saveUrl()">保存</button>
  </div>
  <div class="config-hint" id="configHint" style="margin-top:8px">設定するとスプレッドシートに直接投稿できます</div>
</div>

<!-- PDF -->
<div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
  <div class="drop-icon">📄</div>
  <div class="drop-title">物件PDFをドロップ または クリックして選択</div>
  <div class="drop-sub" id="dropSub">AIが自動で物件情報を読み取ります</div>
  <input type="file" id="fileInput" accept=".pdf" onchange="onFileSelect(event)">
</div>

<button class="btn-analyze" id="btnAnalyze" onclick="analyzePDF()" disabled>
  AIで物件情報を自動入力
</button>

<div class="divider">確認・編集してから投稿</div>

<div id="aiFilledBadge" style="display:none">
  <div class="ai-badge">✦ AIが自動入力 — 内容を確認してから投稿してください</div>
</div>

<!-- フォーム -->
<div class="form-section">
  <div class="section-label">基本情報</div>
  <div class="grid-2">
    <div class="field">
      <label>投稿日</label>
      <input type="date" id="f_date">
    </div>
    <div class="field">
      <label>投稿者</label>
      <input type="text" id="f_reporter" placeholder="例：SAA、Masaki">
    </div>
  </div>
</div>

<div class="form-section">
  <div class="section-label">種別</div>
  <div class="type-grid">
    <button class="type-btn" onclick="selectType(this,'売土地・用地')">売土地・用地</button>
    <button class="type-btn" onclick="selectType(this,'ホテル・旅館')">ホテル・旅館</button>
    <button class="type-btn" onclick="selectType(this,'ビル・建物')">ビル・建物</button>
    <button class="type-btn" onclick="selectType(this,'住宅・戸建')">住宅・戸建</button>
    <button class="type-btn" onclick="selectType(this,'M&A案件')">M&A案件</button>
    <button class="type-btn" onclick="selectType(this,'蓄電池用地')">蓄電池用地</button>
    <button class="type-btn" onclick="selectType(this,'その他')">その他</button>
  </div>
</div>

<div class="form-section">
  <div class="section-label">物件情報</div>
  <div class="field" style="margin-bottom:10px">
    <label>物件名・所在地</label>
    <input type="text" id="f_name" placeholder="例：三交イン名古屋錦（名古屋市中区錦3-7-23）">
  </div>
  <div class="grid-3">
    <div class="field">
      <label>エリア</label>
      <select id="f_area">
        <option value="">選択</option>
        <option>九州</option><option>関西</option><option>東京</option>
        <option>中部</option><option>その他</option>
      </select>
    </div>
    <div class="field">
      <label>坪数・規模</label>
      <input type="text" id="f_tsubo" placeholder="例：1000坪">
    </div>
    <div class="field">
      <label>金額（目線）</label>
      <input type="text" id="f_price" placeholder="例：50億円">
    </div>
  </div>
</div>

<div class="form-section">
  <div class="section-label">条件・備考</div>
  <div class="grid-2">
    <div class="field">
      <label>手数料</label>
      <select id="f_fee">
        <option value="">未定</option>
        <option>両手</option><option>片手</option><option>分かれ</option>
      </select>
    </div>
    <div class="field">
      <label>ステータス</label>
      <select id="f_status">
        <option>未対応</option><option>検討中</option><option>提案済み</option>
        <option>進行中</option><option>成約</option><option>売り止め</option><option>見送り</option>
      </select>
    </div>
  </div>
  <div class="field" style="margin-top:10px">
    <label>担当メモ・補足</label>
    <textarea id="f_memo" placeholder="情報源、特記事項、利回り、室数など"></textarea>
  </div>
</div>

<div class="form-section">
  <div class="section-label">ファイル管理</div>
  <div class="grid-2">
    <div class="field">
      <label>Driveフォルダ場所</label>
      <input type="text" id="f_folder" placeholder="例：社内/物件データ/ホテル">
    </div>
    <div class="field">
      <label>PDFファイル名</label>
      <input type="text" id="f_pdf" placeholder="自動入力されます">
    </div>
  </div>
</div>

<button class="btn-submit" id="btnSubmit" onclick="submitForm()">
  スプレッドシートに投稿
</button>
<div class="status-bar" id="statusBar"></div>

<div id="historyArea" style="display:none" class="history">
  <div class="history-label">投稿済み（今セッション）</div>
  <div id="historyList"></div>
</div>

<script>
let selectedType = '';
let pdfBase64 = '';
let pdfFileName = '';

window.addEventListener('load', () => {
  const saved = localStorage.getItem('gasUrl');
  if (saved) {
    document.getElementById('scriptUrl').value = saved;
    document.getElementById('configStatus').textContent = '✓ 設定済み';
    document.getElementById('configStatus').classList.add('ok');
    document.getElementById('configHint').textContent = '✓ URL設定済み';
    document.getElementById('configHint').style.color = 'var(--green)';
  }
  document.getElementById('f_date').value = new Date().toISOString().split('T')[0];
  document.getElementById('f_folder').value = '社内/物件データ';
});

function toggleConfig() {
  const body = document.getElementById('configBody');
  const arrow = document.getElementById('configArrow');
  body.classList.toggle('open');
  arrow.textContent = body.classList.contains('open') ? '▲' : '▼';
}

function saveUrl() {
  const url = document.getElementById('scriptUrl').value.trim();
  if (!url.includes('script.google.com')) { showStatus('error', 'URLが正しくありません'); return; }
  localStorage.setItem('gasUrl', url);
  document.getElementById('configStatus').textContent = '✓ 設定済み';
  document.getElementById('configStatus').classList.add('ok');
  document.getElementById('configHint').textContent = '✓ URL設定済み';
  document.getElementById('configHint').style.color = 'var(--green)';
  document.getElementById('configBody').classList.remove('open');
  document.getElementById('configArrow').textContent = '▼';
}

function onDragOver(e) { e.preventDefault(); document.getElementById('dropZone').classList.add('drag-over'); }
function onDragLeave(e) { document.getElementById('dropZone').classList.remove('drag-over'); }
function onDrop(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type === 'application/pdf') loadPDF(file);
}
function onFileSelect(e) {
  const file = e.target.files[0];
  if (file) loadPDF(file);
}

function loadPDF(file) {
  pdfFileName = file.name;
  document.getElementById('f_pdf').value = file.name;
  const reader = new FileReader();
  reader.onload = (e) => {
    pdfBase64 = e.target.result.split(',')[1];
    document.getElementById('dropZone').classList.add('has-file');
    document.getElementById('dropSub').textContent = '📎 ' + file.name;
    document.getElementById('btnAnalyze').disabled = false;
  };
  reader.readAsDataURL(file);
}

async function analyzePDF() {
  if (!pdfBase64) return;
  const btn = document.getElementById('btnAnalyze');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>AIが読み取り中...';
  showStatus('loading', '<span class="spinner"></span>PDFから物件情報を抽出しています...');

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `不動産物件概要書PDFを読み取り、以下のJSONのみ返してください。説明文や\`\`\`は不要。
{
  "name": "物件名と所在地",
  "type": "売土地・用地|ホテル・旅館|ビル・建物|住宅・戸建|M&A案件|蓄電池用地|その他 のいずれか",
  "area": "九州|関西|東京|中部|その他 のいずれか",
  "tsubo": "坪数や規模",
  "price": "売却価格",
  "fee": "手数料（両手/片手/分かれ/不明）",
  "memo": "その他重要情報（構造、室数、利回り、交通など）"
}`,
        messages: [{
          role: 'user',
          content: [
            { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: pdfBase64 } },
            { type: 'text', text: 'この物件概要書から情報を抽出してください' }
          ]
        }]
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'API Error');
    const raw = data.content.find(c => c.type === 'text')?.text || '';
    const match = raw.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('JSONが取得できませんでした');
    const parsed = JSON.parse(match[0]);
    fillForm(parsed);
    document.getElementById('aiFilledBadge').style.display = 'block';
    showStatus('success', '✓ PDF読み取り完了。内容を確認して投稿してください。');
  } catch(e) {
    showStatus('error', '読み取りに失敗しました: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'AIで物件情報を自動入力';
  }
}

function fillForm(d) {
  const set = (id, val) => {
    if (!val) return;
    const el = document.getElementById(id);
    el.value = val;
    el.classList.add('ai-filled');
  };
  set('f_name', d.name);
  set('f_area', d.area);
  set('f_tsubo', d.tsubo);
  set('f_price', d.price);
  set('f_fee', d.fee);
  set('f_memo', d.memo);
  if (d.type) {
    document.querySelectorAll('.type-btn').forEach(b => {
      if (b.textContent.trim() === d.type) { b.classList.add('active'); selectedType = d.type; }
    });
  }
}

function selectType(btn, type) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedType = type;
}

async function submitForm() {
  const url = localStorage.getItem('gasUrl') || document.getElementById('scriptUrl').value.trim();
  if (!url) { showStatus('error', 'Apps Script URLを設定してください'); return; }
  const name = document.getElementById('f_name').value.trim();
  if (!name) { showStatus('error', '物件名・所在地を入力してください'); return; }

  const d = new Date(document.getElementById('f_date').value);
  const date = String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
  const reporter = document.getElementById('f_reporter').value;
  const memo = document.getElementById('f_memo').value + (reporter ? '（投稿：' + reporter + '）' : '');

  const payload = {
    date, name,
    type: selectedType,
    area: document.getElementById('f_area').value,
    tsubo: document.getElementById('f_tsubo').value,
    price: document.getElementById('f_price').value,
    fee: document.getElementById('f_fee').value,
    status: document.getElementById('f_status').value,
    memo,
    folder: document.getElementById('f_folder').value,
    pdf: document.getElementById('f_pdf').value
  };

  document.getElementById('btnSubmit').disabled = true;
  showStatus('loading', '<span class="spinner"></span>スプレッドシートに送信中...');

  try {
    await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      mode: 'no-cors'
    });
    addHistory(payload);
    showStatus('success', '✓「' + name + '」をスプレッドシートに投稿しました');
    resetForm();
  } catch(e) {
    showStatus('error', '送信に失敗しました: ' + e.message);
  } finally {
    document.getElementById('btnSubmit').disabled = false;
  }
}

function addHistory(d) {
  const div = document.createElement('div');
  div.className = 'history-item';
  div.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center">' +
      '<div class="history-name">' + d.name + '</div>' +
      '<span class="badge-ok">投稿済み</span>' +
    '</div>' +
    '<div class="history-meta">' +
      '<span>' + d.date + '</span>' +
      '<span>' + (d.type || '種別未設定') + '</span>' +
      '<span>' + (d.area || '') + '</span>' +
      (d.price ? '<span>' + d.price + '</span>' : '') +
      (d.folder ? '<span>📁 ' + d.folder + '</span>' : '') +
    '</div>';
  document.getElementById('historyList').insertBefore(div, document.getElementById('historyList').firstChild);
  document.getElementById('historyArea').style.display = 'block';
}

function showStatus(type, msg) {
  const bar = document.getElementById('statusBar');
  bar.className = 'status-bar visible ' + type;
  bar.innerHTML = msg;
}

function resetForm() {
  ['f_name','f_tsubo','f_price','f_memo'].forEach(id => {
    const el = document.getElementById(id);
    el.value = ''; el.classList.remove('ai-filled');
  });
  ['f_fee','f_area'].forEach(id => {
    const el = document.getElementById(id);
    el.value = ''; el.classList.remove('ai-filled');
  });
  document.getElementById('f_status').value = '未対応';
  document.getElementById('f_pdf').value = '';
  document.getElementById('f_folder').value = '社内/物件データ';
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  selectedType = ''; pdfBase64 = ''; pdfFileName = '';
  document.getElementById('dropZone').classList.remove('has-file');
  document.getElementById('dropSub').textContent = 'AIが自動で物件情報を読み取ります';
  document.getElementById('btnAnalyze').disabled = true;
  document.getElementById('aiFilledBadge').style.display = 'none';
  document.getElementById('f_date').value = new Date().toISOString().split('T')[0];
  document.getElementById('fileInput').value = '';
}
</script>
